name: Report a bug
description: Tell us about something in Nova that does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for taking the time to report this. A few things help us
        fix it quickly: the versions you run, what you saw, what you expected,
        and the log lines from around the time it happened.


        **This repository is public.** Before you paste anything, remove
        names, addresses, entity IDs, device names, IP addresses and anything
        else that identifies you or your home. Stand-ins such as
        `camera.front_door` or `person.alex` are fine.
  - type: input
    id: nova_version
    attributes:
      label: Version of Nova
      description: Shown in HACS, and in Settings → Devices & services → Nova.
      placeholder: "8.67.0"
    validations: { required: true }
  - type: input
    id: home_assistant_version
    attributes:
      label: Version of Home Assistant
      description: Settings → About.
      placeholder: "2026.10.1"
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: What Nova did, said or showed.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What Nova should have done instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps, if you know them. Leave it empty if it happens at random.
      placeholder: "1. Open Nova's panel  2. ..."
  - type: textarea
    id: log_lines
    attributes:
      label: Logs
      description: "Lines that mention nova from Settings → System → Logs, and anything
        relevant from the log page in Nova's panel. Remove personal details
        first."
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Your setup
      description: "Which AI models or providers Nova uses, and whether cameras, voice
        satellites or speakers are involved. No names or addresses, please."
