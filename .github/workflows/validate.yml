name: Validate

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest (integration manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Hassfest validation
        # pinned to a commit (was floating @master); bump when updating
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: HACS validation
        # pinned to v22.5.0 (was floating @main)
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a
        with:
          category: integration
          # explicit token: hacs/action needs to call the GitHub API for repo
          # metadata (topics, description, license, file contents) — its
          # default of `github.token` should cover this, but being explicit
          # removes any doubt (11 Sept 2026).
          github_token: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Audit + tests (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio pyflakes pyyaml
      - name: Audit (compile + imports + names)
        run: python scripts/audit.py
      - name: Unit tests
        run: python -m pytest tests/ -q

  integration:
    name: Integration tests (PHACC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          # Verified locally against this exact version only (Python 3.13.15,
          # pytest-homeassistant-custom-component pulling in homeassistant
          # 2026.2.3) — not against 3.14, unlike the plain unit suite above,
          # so this job stays single-version until that's checked too.
          python-version: "3.13"
      - name: Install PHACC + Nova's own manifest requirements
        # Must run in a venv separate from the plain unit suite in practice —
        # PHACC pulls in the real `homeassistant` package, which collides
        # with tests/unit/'s hand-rolled fakes and sys.modules stubs
        # (confirmed live: installing PHACC into that shared venv took 1634
        # passing unit tests to 1465 errors). Each CI job already runs in its
        # own clean environment, so no extra isolation is needed here — just
        # don't fold this step into the "tests" job above.
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component==0.13.316
          # Nova's own runtime dependencies (manifest.json) — the LLM
          # provider clients async_setup_entry actually constructs.
          pip install 'groq>=0.9.0' 'openai>=1.0.0' 'anthropic>=0.39.0' 'pypdf>=4.0.0'
          # Extra Home Assistant component dependencies Nova's setup path
          # pulls in (camera, frontend/panel_custom, conversation) that
          # PHACC's own install doesn't bring along on its own.
          pip install PyTurboJPEG home-assistant-frontend
          # Exact versions read from homeassistant/components/conversation/
          # manifest.json's requirements — the latest hassil (3.12.1) is
          # missing a submodule (hassil.fuzzy) this installed HA version
          # needs, so don't "latest"-install these.
          pip install 'hassil==3.5.0' 'home-assistant-intents==2026.1.28'
      - name: Integration tests
        run: python -m pytest tests/integration/ -v

  frontend:
    name: Frontend (syntax + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
      - name: Panel syntax check
        run: node --check custom_components/nova/frontend/nova-panel.js
      - name: Panel smoke test
        run: |
          mkdir -p /tmp/jsdomtest && cd /tmp/jsdomtest
          npm init -y >/dev/null 2>&1
          npm install jsdom >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/jsdomtest/node_modules node scripts/smoke_panel.js
