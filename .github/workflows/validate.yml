# Every check a change must pass: manifest and HACS validation, the audit,
# types, unit tests with coverage floors, the Home Assistant integration
# tests, and the panel build and smoke test.
name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, to catch breakage from new releases of unpinned tools
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    name: Hassfest (integration manifest)
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Check the manifest with hassfest
        # Pinned to a commit; bump it deliberately.
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  hacs:
    runs-on: ubuntu-latest
    name: HACS validation
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Check the repository with HACS
        # v22.5.0, pinned to a commit.
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a
        with:
          category: integration
          # The action reads repository details (topics, description,
          # licence) through the GitHub API, so it gets the token outright.
          github_token: ${{ secrets.GITHUB_TOKEN }}

  tests:
    runs-on: ubuntu-latest
    name: Audit + tests (py ${{ matrix.python-version }})
    strategy:
      # Both versions run to the end, even when one of them fails.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python-version }}" }
      - name: Install the test tools
        # Listed in ci/requirements-unit.txt so Dependabot can keep them current.
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r ci/requirements-unit.txt
      - name: Audit (compile, imports, names, architecture)
        run: python scripts/audit.py
      - name: Types
        run: python -m mypy
      - name: Unit tests with coverage
        run: python -m pytest tests/ -q --cov=custom_components/nova --cov-report=json:coverage.json --cov-report=term:skip-covered
      - name: Coverage floors
        run: python scripts/coverage_floors.py coverage.json

  integration:
    runs-on: ubuntu-latest
    name: Integration tests (real HA, newest AI libraries)
    # Its own job on purpose: PHACC installs the real homeassistant package,
    # which clashes with the stand-ins the unit tests use. Nothing here is
    # pinned by hand: the newest PHACC brings the newest Home Assistant it
    # supports, HA's own components say which versions they need, and the
    # AI libraries are the newest releases. A new release that breaks Nova
    # fails here, including tests/integration/test_real_ai_libraries.py.
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install PHACC and Nova's requirements
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pytest-homeassistant-custom-component
          # Nova's own requirements from manifest.json, newest that match.
          pip install --upgrade 'groq>=0.9.0' 'openai>=1.0.0' 'anthropic>=0.39.0' 'pypdf>=4.0.0' 'wyoming==1.10.2'
          # The exact versions the installed HA's components (conversation,
          # camera, frontend, assist pipeline...) ask for.
          python scripts/ha_component_requirements.py > ha-component-requirements.txt
          pip install -r ha-component-requirements.txt
      - name: Versions under test
        run: |
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
          pip list 2>/dev/null | grep -iE '^(pytest-homeassistant-custom-component|anthropic|openai|groq) '
      - name: Integration tests
        run: python -m pytest tests/integration/ -v

  frontend:
    runs-on: ubuntu-latest
    name: Frontend (syntax + smoke)
    env:
      NODE_PATH: /tmp/jsdomtest/node_modules
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install jsdom for the panel checks
        # The version is in ci/package.json, which Dependabot keeps current.
        # Installed outside the repository so the repo's own node_modules
        # can't mix in. Install errors are shown, not hidden.
        run: |
          mkdir -p /tmp/jsdomtest
          cp ci/package.json /tmp/jsdomtest/
          npm install --prefix /tmp/jsdomtest --no-audit --no-fund
      - name: The built panel matches frontend/src
        run: python3 scripts/build_panel.py --check
      - name: The built panel parses
        run: node --check custom_components/nova/frontend/nova-panel.js
      - name: Smoke test the panel under jsdom
        run: node scripts/smoke_panel.js
      - name: The panel's string list is up to date
        run: node scripts/panel_strings.js --check
      - name: Late panel text goes through translation
        run: node scripts/late_text_check.js
