# Every check a change must pass: manifest and HACS validation, the audit,
# types, unit tests with coverage floors, the Home Assistant integration
# tests, and the panel build and smoke test.
name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, to catch breakage from new releases of unpinned tools
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    name: Hassfest (integration manifest)
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Check the manifest with hassfest
        # Pinned to a commit; bump it deliberately.
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  hacs:
    runs-on: ubuntu-latest
    name: HACS validation
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Check the repository with HACS
        # v22.5.0, pinned to a commit.
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a
        with:
          category: integration
          # The action reads repository details (topics, description,
          # licence) through the GitHub API, so it gets the token outright.
          github_token: ${{ secrets.GITHUB_TOKEN }}

  tests:
    runs-on: ubuntu-latest
    name: Audit + tests (py ${{ matrix.python-version }})
    strategy:
      # Both versions run to the end, even when one of them fails.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python-version }}" }
      - name: Install the test tools
        # wyoming is pinned to the version Home Assistant's own wyoming
        # integration uses; Nova's Voice ID client and its tests need it.
        run: >-
          python -m pip install --upgrade pip pytest pytest-asyncio pyflakes pyyaml
          mypy==2.3.1 pytest-cov==7.1.0 voluptuous wyoming==1.10.2
      - name: Audit (compile, imports, names, architecture)
        run: python scripts/audit.py
      - name: Types
        run: python -m mypy
      - name: Unit tests with coverage
        run: python -m pytest tests/ -q --cov=custom_components/nova --cov-report=json:coverage.json --cov-report=term:skip-covered
      - name: Coverage floors
        run: python scripts/coverage_floors.py coverage.json

  integration:
    runs-on: ubuntu-latest
    name: Integration tests (PHACC)
    # Its own job on purpose: PHACC installs the real homeassistant package,
    # which clashes with the stand-ins the unit tests use.
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with:
          # Checked against 3.13 only (homeassistant 2026.2.3 through PHACC).
          python-version: "3.13"
      - name: Install PHACC and Nova's requirements
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component==0.13.316
          # Nova's own requirements from manifest.json.
          pip install 'groq>=0.9.0' 'openai>=1.0.0' 'anthropic>=0.39.0' 'pypdf>=4.0.0' 'wyoming==1.10.2'
          # Components Nova's setup loads (camera, frontend, panel_custom,
          # conversation) that PHACC does not bring with it.
          pip install PyTurboJPEG home-assistant-frontend
          # The exact versions conversation's manifest asks for; newer hassil
          # releases lack a module this Home Assistant version imports.
          pip install 'hassil==3.5.0' 'home-assistant-intents==2026.1.28'
          # Optional imports of assist_pipeline (through tts and wake_word),
          # loaded by the Setup Doctor tests.
          pip install mutagen ha-ffmpeg pymicro-vad pyspeex-noise
      - name: Integration tests
        run: python -m pytest tests/integration/ -v

  frontend:
    runs-on: ubuntu-latest
    name: Frontend (syntax + smoke)
    env:
      NODE_PATH: /tmp/jsdomtest/node_modules
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install jsdom for the panel checks
        # Outside the repository, and pinned, so a new jsdom release cannot
        # change the result. Install errors are shown, not hidden.
        run: npm install --prefix /tmp/jsdomtest --no-save --no-audit --no-fund jsdom@29.1.1
      - name: The built panel matches frontend/src
        run: python3 scripts/build_panel.py --check
      - name: The built panel parses
        run: node --check custom_components/nova/frontend/nova-panel.js
      - name: Smoke test the panel under jsdom
        run: node scripts/smoke_panel.js
      - name: The panel's string list is up to date
        run: node scripts/panel_strings.js --check
      - name: Late panel text goes through translation
        run: node scripts/late_text_check.js
