# Type checking for Nova's architecture packages. Run from the repo root:
#   python -m mypy
# Home Assistant and SDKs are not installed in CI's unit job, so their
# imports are treated as Any. Every top-level module is checked too (8.85.12;
# before that only the packages were), so the safety code is covered.

[mypy]
python_version = 3.13
mypy_path = custom_components
packages = nova
ignore_missing_imports = True
follow_imports = silent
warn_unused_configs = True
warn_redundant_casts = True
disable_error_code = annotation-unchecked

# The persistence boundary is small and has no Home Assistant coupling, so it
# is held to strict typing.
[mypy-nova.persistence.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_any_generics = True
check_untyped_defs = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
