<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <radialGradient id="g" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#2a1c11" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#15110d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4b860"/>
      <stop offset="100%" stop-color="#e2542f"/>
    </linearGradient>
    <linearGradient id="accentCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5fa8d8"/>
      <stop offset="100%" stop-color="#f4b860"/>
    </linearGradient>
  </defs>
  <rect width="580" height="440" fill="#15110d"/>
  <rect width="580" height="440" fill="url(#g)"/>

  <!-- panel -->
  <rect x="20" y="20" width="540" height="400" rx="16" fill="#1e1712" stroke="#33291f"/>
  <text x="42" y="53" fill="#f3ece1" font-family="'Fraunces',ui-serif,Georgia,serif" font-size="16" font-weight="600">Areas</text>
  <text x="538" y="53" fill="#7a6d5e" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="10" letter-spacing="1.5" text-anchor="end">14 MONITORED</text>
  <line x1="42" y1="66" x2="538" y2="66" stroke="#33291f"/>

  <!-- tile 1: Kitchen -->
  <g transform="translate(42,84)">
    <rect width="496" height="140" rx="12" fill="#2a2119" stroke="#33291f"/>
    <rect x="0" y="0" width="496" height="4" rx="2" fill="url(#accentWarm)"/>
    <text x="18" y="34" fill="#f3ece1" font-size="14" font-weight="600">Kitchen</text>
    <text x="478" y="34" fill="#a89a89" font-size="12.5" text-anchor="end">71&#176;F &#183; 44%</text>
    <!-- capability icons -->
    <g transform="translate(18,50)" fill="none" stroke="#a89a89" stroke-width="1.5">
      <circle cx="8" cy="8" r="8" fill="#33291f" stroke="none"/>
      <path d="M5 5 L8 5 L11 8 L11 12 L8 12 L5 15 Z" fill="#f4b860" stroke="none" transform="translate(0,-2) scale(0.7)"/>
      <circle cx="34" cy="8" r="8" fill="#33291f" stroke="none"/>
      <circle cx="34" cy="8" r="3" fill="#f4b860" stroke="none"/>
      <circle cx="60" cy="8" r="8" fill="#33291f" stroke="none"/>
      <rect x="56" y="5" width="8" height="6" rx="1.5" fill="#6fbf8a" stroke="none"/>
      <circle cx="86" cy="8" r="8" fill="#33291f" stroke="none"/>
      <rect x="83" y="4" width="6" height="8" rx="1" fill="#a89a89" stroke="none"/>
    </g>
    <!-- sparkline -->
    <polyline points="18,108 60,102 102,110 144,96 186,100 228,88 270,94" fill="none" stroke="#f4b860" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- toggle -->
    <g transform="translate(440,96)">
      <rect width="38" height="20" rx="10" fill="#e2542f"/>
      <circle cx="28" cy="10" r="8" fill="#ffe3ad"/>
    </g>
    <text x="18" y="128" fill="#7a6d5e" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="9.5" letter-spacing="0.5">4 LIGHTS &#183; 1 SATELLITE &#183; MMWAVE</text>
  </g>

  <!-- tile 2: Living Room -->
  <g transform="translate(42,236)">
    <rect width="496" height="140" rx="12" fill="#2a2119" stroke="#33291f"/>
    <rect x="0" y="0" width="496" height="4" rx="2" fill="url(#accentCool)"/>
    <text x="18" y="34" fill="#f3ece1" font-size="14" font-weight="600">Living Room</text>
    <text x="478" y="34" fill="#a89a89" font-size="12.5" text-anchor="end">68&#176;F &#183; 41%</text>
    <g transform="translate(18,50)" fill="none" stroke="#a89a89" stroke-width="1.5">
      <circle cx="8" cy="8" r="8" fill="#33291f" stroke="none"/>
      <path d="M5 5 L8 5 L11 8 L11 12 L8 12 L5 15 Z" fill="#f4b860" stroke="none" transform="translate(0,-2) scale(0.7)"/>
      <circle cx="34" cy="8" r="8" fill="#33291f" stroke="none"/>
      <circle cx="34" cy="8" r="3" fill="#f4b860" stroke="none"/>
      <circle cx="60" cy="8" r="8" fill="#33291f" stroke="none"/>
      <rect x="57" y="4" width="6" height="8" rx="1" fill="#6fbf8a" stroke="none"/>
    </g>
    <polyline points="18,110 60,104 102,106 144,98 186,102 228,92 270,90" fill="none" stroke="#5fa8d8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <g transform="translate(440,96)">
      <rect width="38" height="20" rx="10" fill="#33291f"/>
      <circle cx="10" cy="10" r="8" fill="#a89a89"/>
    </g>
    <text x="18" y="128" fill="#7a6d5e" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="9.5" letter-spacing="0.5">3 LIGHTS &#183; 1 CAMERA &#183; SPEAKER</text>
  </g>
</svg>
