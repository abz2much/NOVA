blueprint:
  name: Nova — Announce recognised faces
  description: >
    When a face is recognised on a camera (DoubleTake or Frigate face
    names), Nova says who it is, or warns about an unknown person and
    describes them. Runs on the `nova_face_recognized` event.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    target_camera:
      name: Camera (optional)
      description: Only announce faces seen on this camera. Leave empty for every camera.
      default: ""
      selector:
        entity:
          domain: camera
    greet_known:
      name: Announce known people
      description: Say who has been recognised and where.
      default: true
      selector:
        boolean:
    alert_unknown:
      name: Warn about unknown people
      description: Announce an unknown person and have Nova describe them.
      default: true
      selector:
        boolean:
    cooldown_seconds:
      name: Cooldown
      description: >-
        After an announcement, further recognitions on any camera are ignored
        for this long, so the same visit is not announced twice.
      default: 300
      selector:
        number:
          min: 30
          max: 3600
          unit_of_measurement: seconds

triggers:
  - trigger: event
    event_type: nova_face_recognized

# Repeats inside the cooldown are dropped, not queued, so nothing is
# announced late.
mode: single
max_exceeded: silent

variables:
  target_cam: !input target_camera
  greet: !input greet_known
  alert_unk: !input alert_unknown
  seen: "{{ trigger.event.data }}"
  place: "{{ seen.camera | replace('_', ' ') }}"

conditions:
  - condition: template
    value_template: >-
      {{ not target_cam or seen.camera_entity == target_cam }}

actions:
  - choose:
      # A known face must be a confident match before it is named.
      - conditions:
          - condition: template
            value_template: >-
              {{ greet and not seen.is_unknown and seen.is_confident }}
        sequence:
          - action: nova.analyze_on_event
            data:
              entity_id: "{{ seen.camera_entity }}"
              reason: "{{ seen.name }} has been recognised at the {{ place }}"
      # An unknown face has no match to be confident about.
      - conditions:
          - condition: template
            value_template: >-
              {{ alert_unk and seen.is_unknown }}
        sequence:
          - action: nova.analyze_on_event
            data:
              entity_id: "{{ seen.camera_entity }}"
              reason: "An unknown person has been seen at the {{ place }}; describe them"
    default:
      # Nothing announced, so no cooldown either.
      - stop: Nothing to announce
  - delay:
      seconds: !input cooldown_seconds
