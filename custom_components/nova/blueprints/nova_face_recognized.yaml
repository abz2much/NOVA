blueprint:
  name: Nova — Announce recognised faces
  domain: automation
  description: >
    Each time a camera recognises a face (face names from DoubleTake or
    Frigate), Nova names a known person, or warns about someone it does not
    know and describes them. It listens for the `nova_face_recognized` event.
  homeassistant:
    min_version: 2024.10.0
  input:
    target_camera:
      name: Camera (optional)
      description: Announce faces from this camera only. Leave it empty to use every camera.
      selector:
        entity:
          domain: camera
      default: ""
    greet_known:
      name: Announce known people
      description: Say which person was recognised, and on which camera.
      selector:
        boolean:
      default: true
    alert_unknown:
      name: Warn about unknown people
      description: Speak up about a face Nova does not know and ask it to describe the person.
      selector:
        boolean:
      default: true
    cooldown_seconds:
      name: Cooldown
      description: >-
        How long to ignore further faces, on every camera, after an
        announcement, so one visit is announced once.
      selector:
        number:
          min: 30
          max: 3600
          unit_of_measurement: seconds
      default: 300

triggers:
  - trigger: event
    event_type: nova_face_recognized

# A face seen again during the cooldown is dropped, never queued, so
# nothing is announced late.
mode: single
max_exceeded: silent

variables:
  target_cam: !input target_camera
  greet: !input greet_known
  alert_unk: !input alert_unknown
  seen: "{{ trigger.event.data }}"
  place: "{{ seen.camera | replace('_', ' ') }}"

conditions:
  - condition: template
    value_template: >-
      {{ not target_cam or seen.camera_entity == target_cam }}

actions:
  - choose:
      # Name a known face only when the match is confident.
      - conditions:
          - condition: template
            value_template: >-
              {{ greet and not seen.is_unknown and seen.is_confident }}
        sequence:
          - action: nova.analyze_on_event
            data:
              entity_id: "{{ seen.camera_entity }}"
              reason: "{{ seen.name }} has been recognised at the {{ place }}"
      # An unknown face has no match, so no confidence to check.
      - conditions:
          - condition: template
            value_template: >-
              {{ alert_unk and seen.is_unknown }}
        sequence:
          - action: nova.analyze_on_event
            data:
              entity_id: "{{ seen.camera_entity }}"
              reason: "An unknown person has been seen at the {{ place }}; describe them"
    default:
      # Nothing was said, so there is no cooldown to wait out.
      - stop: Nothing to announce
  - delay:
      seconds: !input cooldown_seconds
