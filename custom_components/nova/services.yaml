analyze_camera:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: camera
    prompt:
      required: false
      example: "Is anyone waiting at the door?"
      selector:
        text:
    announce:
      required: false
      selector:
        boolean:
    frames:
      required: false
      example: 3
      selector:
        number:
          min: 1
          max: 6
          mode: slider
    interval:
      required: false
      example: 1.2
      selector:
        number:
          min: 0.5
          max: 5
          step: 0.1
          mode: slider

